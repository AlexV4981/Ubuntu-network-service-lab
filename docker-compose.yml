services:
  helpy-bot:
    build: .
    container_name: helpy-bot
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      MAVEN_CONFIG: /tmp/.m2
    env_file:
      - .env
    volumes:
      - ./ingest:/ingest
    networks:
      - helpy-network
    stdin_open: true
    tty: true


  minecraft-controller:
    build:
      context: ./controller
    container_name: minecraft-controller
    restart: unless-stopped
    networks:
      - helpy-network
    volumes:
      # Docker API access for controlling Minecraft containers
      - /var/run/docker.sock:/var/run/docker.sock

      # Controller database
      - ./controller/data:/data


  ingest:
    build: ./ingest
    container_name: ingest
    restart: unless-stopped
    volumes:
      # ingestion application + output/state
      - ./ingest:/ingest

      # Minecraft logs
      - /home/titus-tech/mc-cobblemon/data/logs:/mc-logs/mc-cobblemon:ro
      - /home/titus-tech/mc-horror/data/logs:/mc-logs/mc-horror:ro

      # Controller SQLite database
      - ./controller/data:/controller/data:ro

    depends_on:
      - minecraft-controller

    networks:
      - helpy-network


networks:
  helpy-network:
    name: helpy-network
